name: CI & Deploy

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, test, and deploy
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # -------------------------
      # Frontend
      # -------------------------

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build -- --configuration production

      # -------------------------
      # Backend
      # -------------------------

      - name: Restore backend
        run: dotnet restore Tansekak.sln

      - name: Build backend
        run: dotnet build Tansekak.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tansekak.sln --configuration Release --no-build

      # -------------------------
      # Publish
      # -------------------------

      - name: Restore API for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: >
          dotnet restore src/Tansekak.Api/Tansekak.Api.csproj
          --runtime win-x86

      - name: Publish API
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: >
          dotnet publish src/Tansekak.Api/Tansekak.Api.csproj
          --configuration Release
          --no-restore
          --output "${{ github.workspace }}\publish"
          --runtime win-x86
          --self-contained true

      # -------------------------
      # Angular → ASP.NET wwwroot
      # -------------------------

      - name: Copy frontend to wwwroot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\wwwroot | Out-Null

          Copy-Item `
            -Path client\dist\client\browser\* `
            -Destination publish\wwwroot `
            -Recurse `
            -Force

      # -------------------------
      # Deploy to MonsterASP
      # -------------------------

      - name: Deploy to MonsterASP.NET via Web Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: true
