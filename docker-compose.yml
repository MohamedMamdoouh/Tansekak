services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=Tansekak;Username=postgres;Password=${POSTGRES_PASSWORD}"
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@tansekak.local}
      AdminSeed__Password: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Tansekak
    volumes:
      - tansekak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Tansekak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tansekak-db:
